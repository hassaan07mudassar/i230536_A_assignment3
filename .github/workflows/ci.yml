name: MLOps Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Lint, Test, Validate Manifests, and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-mock httpx fastapi uvicorn pydantic pydantic-settings python-json-logger scikit-learn pandas numpy joblib dvc mlflow kubernetes pyyaml reportlab pillow

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Verify DVC Pipeline Reproducibility
        run: |
          dvc repro --dry || true

      - name: Validate Kubernetes Manifests
        run: |
          for f in kubernetes/*.yaml; do
            echo "Validating manifest schema: $f"
            python -c "import yaml; list(yaml.safe_load_all(open('$f')))"
          done

      - name: Check DAG Import Integrity
        run: |
          python -c "
          import os
          print('Verifying Airflow DAG file presence and syntax...')
          with open('dags/training_pipeline.py') as f:
              code = f.read()
              compile(code, 'dags/training_pipeline.py', 'exec')
          print('DAG syntax verified successfully.')
          "

      - name: Initialize Test MLflow Tracking DB & Registry
        run: |
          python scripts/generate_runs.py
          python scripts/register_models.py

      - name: Run Pytest Test Suite with Coverage
        env:
          TEST_MODE: "1"
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          pytest --cov=agent --cov=api --cov-report=term --cov-report=xml:coverage.xml tests/

      - name: Build Inference Docker Image (No Push)
        run: |
          docker build -t churn-inference:test-build .

