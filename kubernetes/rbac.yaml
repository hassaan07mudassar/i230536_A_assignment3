apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent-sa
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: mlops-agent
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-role
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: mlops-agent
    app.kubernetes.io/component: rbac
rules:
  # Read-only observation permissions across workload and events
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Controlled deployment management (read-only + rollouts/scaling only)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-rolebinding
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: mlops-agent
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: mlops-agent-sa
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent-role
  apiGroup: rbac.authorization.k8s.io

