[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
description = "Production-Ready MLOps AI Agent for DVC, MLflow, Airflow 3, and Kubernetes"
authors = [
    { name = "Hassaan Mudassar", email = "i230536@isb.nu.edu.pk" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-json-logger>=2.0.7",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.2",
    "mlflow>=2.11.0",
    "dvc>=3.48.0",
    "kubernetes>=29.0.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=agent --cov=api --cov-report=term-missing"

[tool.coverage.run]
source = ["agent", "api"]
omit = ["tests/*"]

